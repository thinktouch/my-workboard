<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eef5fa">
  <meta name="description" content="用重要与紧急整理任务的个人工作台。">
  <title>我的工作台</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="workspace.css?v=36">
  <link rel="stylesheet" href="coordinate.css?v=21">
  <script src="task-motion.js?v=1" defer></script>
  <script src="app.js?v=26" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到任务工作区</a>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m6 12 4 4 8-9"/></symbol>
    <symbol id="i-done" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4L16.5 3.5Z"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M7 7h10v10M17 7 7 17"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M12 3.2 14.3 9.7 20.8 12l-6.5 2.3L12 20.8 9.7 14.3 3.2 12l6.5-2.3Z"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M8.5 3.5v3.5m7-3.5v3.5M4 10.5h16"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><path d="M4 8.5h3.3m4.4 0H20M4 15.5h8.3m4.4 0H20"/><circle cx="9.5" cy="8.5" r="2.2"/><circle cx="14.5" cy="15.5" r="2.2"/></symbol>
    <symbol id="i-progress" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 1-9 9M3 7V3h4M12 7v5l3 2"/></symbol>
    <symbol id="i-coffee" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M9.6 9.2v5.6m4.8-5.6v5.6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
  </defs></svg>
  <div class="workspace">
    <header class="topbar">
      <a class="brand" href="./" aria-label="我的工作台首页"><img class="brand-mark" src="brand/current.svg" alt="" width="24" height="24"><h1 class="brand-name">我的工作台</h1></a>
      <form id="task-form" class="quick-capture" novalidate><label class="sr-only" for="task-input">任务内容</label><input id="task-input" name="task" placeholder="安排下一项任务…" maxlength="500" autocomplete="off"><div class="send-targets" role="group" aria-label="发送到象限"></div></form>
      <div class="topbar-tools"><label class="search"><svg aria-hidden="true"><use href="#i-search"/></svg><input id="search-input" name="search" aria-label="搜索任务" placeholder="搜索" autocomplete="off"><kbd>/</kbd></label><nav class="filter-tabs" aria-label="任务视图"><button data-filter="all" class="selected" aria-pressed="true">全部（0）</button><button id="nav-board" data-filter="pending" aria-pressed="false">待办（0）</button><button id="nav-processing" data-filter="processing" aria-pressed="false">处理中（0）</button><button id="nav-done" data-filter="done" aria-pressed="false">已完成（0）</button></nav><button id="trash-toggle" class="trash-toggle" aria-label="最近删除" aria-expanded="false" aria-controls="recent-deleted"><span>最近删除</span><span id="trash-badge" class="trash-badge" hidden></span></button></div>
    </header>
    <main id="main-content" tabindex="-1">
      <div id="feedback" class="sr-only" role="status" aria-live="polite"></div>
      <section class="coordinate-frame" aria-label="四象限任务坐标系">
        <div class="hud-corners" aria-hidden="true"><i class="hud-c tl"></i><i class="hud-c tr"></i><i class="hud-c bl"></i><i class="hud-c br"></i></div>
        <div class="coordinate-axes" aria-hidden="true">
          <div class="axis-line axis-x"><svg class="axis-head" viewBox="0 0 14 14"><path class="head-sub" d="M3 4.5 5.5 7 3 9.5"/><path class="head-main" d="M6.5 2.5 11.5 7 6.5 11.5"/></svg></div>
          <div class="axis-line axis-y"><svg class="axis-head" viewBox="0 0 14 14"><path class="head-sub" d="M4.5 11 7 8.5 9.5 11"/><path class="head-main" d="M2.5 7.5 7 2.5 11.5 7.5"/></svg></div>
          <span class="axis-label axis-top">重要</span><span class="axis-label axis-bottom">不重要</span><span class="axis-label axis-left">不紧急</span><span class="axis-label axis-right">紧急</span>
          <span class="axis-origin"><i></i></span>
        </div>
        <div class="matrix" id="matrix"></div>
      </section>
    </main>
    <button id="drawer-backdrop" class="drawer-backdrop" type="button" tabindex="-1" aria-label="关闭最近删除抽屉" aria-hidden="true" hidden></button>
    <aside id="recent-deleted" class="recent-deleted" role="dialog" aria-modal="true" aria-labelledby="deleted-title" aria-hidden="true" tabindex="-1" inert hidden>
        <div class="deleted-heading"><h2 id="deleted-title">最近删除</h2><span id="deleted-count"></span><button id="clear-deleted" class="clear-deleted" aria-label="清空最近删除" aria-expanded="false" aria-controls="clear-deleted-confirm">清空</button><button id="close-deleted" class="small-action" aria-label="关闭最近删除"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div>
        <div id="clear-deleted-confirm" class="delete-confirm" role="group" aria-label="清空最近删除确认" hidden><span>永久删除所有最近删除项？此操作无法恢复。</span><button id="confirm-clear-deleted" class="confirm-danger">确认清空</button><button id="cancel-clear-deleted">取消</button></div>
        <div id="deleted-list" class="deleted-list" role="region" aria-label="已删除任务列表" tabindex="0"></div>
    </aside>
  </div>
  <div id="task-menu" class="task-menu" role="group" aria-label="任务操作与时间" hidden></div>
</body>
</html>
